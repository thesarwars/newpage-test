name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deliberately no workflow-level `env:`. DJANGO_SETTINGS_MODULE used to live
# here, for the backend job's pytest — and leaked into every other job, where
# `docker compose` interpolates it into the api container. The e2e stack was
# therefore running *test* settings: DEBUG off, no wildcard ALLOWED_HOSTS, a
# per-process SECRET_KEY. It tested a differently-configured application than
# anyone runs, and failed with a DisallowedHost that pointed nowhere near the
# cause. It is scoped to the job that needs it instead.
#
# CI never has an Anthropic key. Every gate below must pass without one — the
# same constraint a reviewer running this repo is under.

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cia
          POSTGRES_USER: cia
          # trust, rather than a password literal. This container lives for the
          # length of one job, is reachable only from that job, and a committed
          # password — however throwaway — is a password-shaped string in a
          # public repository that secret scanners are right to flag.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cia -d cia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # The image bakes the ONNX weights at /opt/models, but CI runs on the
      # runner rather than in the image, so it needs its own cache location.
      # The embedder is deliberately *not* mocked in tests (docs/PLAN.md §11) —
      # fastembed on CPU is deterministic, and mocking it would mean the
      # retrieval tests assert nothing.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/backend/.fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/backend/.fastembed
          # Keyed on the model, not the lockfile: the weights change only when
          # the model does.
          key: fastembed-bge-small-en-v1.5-v1
      - run: uv sync --frozen --group dev
      # The cache above restores the weights; on a miss they still have to be
      # fetched. Without this the cache step silently creates an empty directory
      # and every tokenizer-dependent test fails on a clean cache.
      - name: fetch embedding model
        run: uv run python -c "from fastembed import TextEmbedding; TextEmbedding('BAAI/bge-small-en-v1.5')"
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing
      # Retrieval quality as a build gate, not a README claim. Thresholds sit
      # just below the committed baseline in backend/evals/baseline.json, so a
      # change that degrades retrieval fails here rather than being discovered
      # by a user. Needs no API key — every metric is deterministic.
      - name: eval gate
        run: |
          uv run python manage.py migrate --noinput
          uv run python manage.py run_eval \
            --fail-under-hit-rate 0.95 \
            --fail-under-routing 1.0

  frontend:
    runs-on: ubuntu-latest
    env:
      # `pnpm build` posts anonymous telemetry to Vercel otherwise, and the
      # README claims api.anthropic.com is the only external egress this project
      # has. CI is where that claim is cheapest to keep true.
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # `defaults.run.working-directory` applies only to `run:` steps, never
          # to `uses:` actions — so this action looks for package.json at the
          # repo root, finds nothing, and fails with "No pnpm version is
          # specified" even though frontend/package.json pins packageManager.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # The frontend had no test framework until M6, so `lint + typecheck +
      # build` were three checks that could not tell you a component rendered
      # the wrong thing. See docs/adr/0009.
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # compose now *requires* POSTGRES_PASSWORD, which means even `build` needs
      # a .env. Generating it with the same target a reviewer runs means this job
      # also exercises the generation path rather than working around it.
      - name: generate .env
        run: make .env
      - name: build all images
        run: docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks *action* derives a commit range from the push event. On the
      # first push that range is `<first-commit>^..<head>`, whose left side is
      # not a revision, so it errored — after reporting "no leaks found in
      # partial scan" having scanned ~0 bytes. A gate that passes by scanning
      # nothing is worse than one that fails, so this runs the tool directly and
      # scans the full history every time.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --no-banner

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: generate .env
        run: make .env
      - name: start the stack
        run: docker compose up -d --build api web

      # readyz requires the `vector` extension, which the initial migration
      # creates. Without this the API answers 503 forever and the wait below
      # burns its whole budget on a stack that was never going to come up.
      - name: migrate
        run: docker compose exec -T api python manage.py migrate --noinput

      - name: wait for the stack
        run: |
          for i in $(seq 1 60); do
            curl -fsS http://localhost:8000/readyz >/dev/null 2>&1 \
              && curl -fsS http://localhost:3000/ >/dev/null 2>&1 && exit 0
            sleep 2
          done
          docker compose logs --tail=60
          exit 1

      # Run in the same container `make e2e` uses, rather than on the runner.
      #
      # The first version installed the frontend's dependencies on the runner so
      # Playwright could run there — into `frontend/`, which is bind-mounted into
      # the web container. Next noticed and said so exactly: "Could not find the
      # Next.js package … node_modules is being reorganized by a concurrent
      # install". Running in the container means the runner never touches that
      # directory, and CI exercises the identical path a developer does.
      - name: acceptance
        run: docker compose run --rm e2e

      - name: diagnose
        if: failure()
        run: docker compose logs --tail=100
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-trace
          path: frontend/test-results/
          retention-days: 5
