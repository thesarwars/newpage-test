name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CI never has an Anthropic key. Every gate below must pass without one —
  # that is the same constraint a reviewer running this repo is under.
  DJANGO_SETTINGS_MODULE: config.settings.test

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: cia
          POSTGRES_USER: cia
          POSTGRES_PASSWORD: cia
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cia -d cia"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      # The image bakes the ONNX weights at /opt/models, but CI runs on the
      # runner rather than in the image, so it needs its own cache location.
      # The embedder is deliberately *not* mocked in tests (docs/PLAN.md §11) —
      # fastembed on CPU is deterministic, and mocking it would mean the
      # retrieval tests assert nothing.
      FASTEMBED_CACHE_PATH: ${{ github.workspace }}/backend/.fastembed
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: cache embedding model
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/backend/.fastembed
          # Keyed on the model, not the lockfile: the weights change only when
          # the model does.
          key: fastembed-bge-small-en-v1.5-v1
      - run: uv sync --frozen --group dev
      - name: ruff
        run: uv run ruff check .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: uv run mypy .
      - name: pytest
        run: uv run pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          # `defaults.run.working-directory` applies only to `run:` steps, never
          # to `uses:` actions — so this action looks for package.json at the
          # repo root, finds nothing, and fails with "No pnpm version is
          # specified" even though frontend/package.json pins packageManager.
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: build all images
        run: docker compose build

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # The gitleaks *action* derives a commit range from the push event. On the
      # first push that range is `<first-commit>^..<head>`, whose left side is
      # not a revision, so it errored — after reporting "no leaks found in
      # partial scan" having scanned ~0 bytes. A gate that passes by scanning
      # nothing is worse than one that fails, so this runs the tool directly and
      # scans the full history every time.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest \
            git /repo --redact --no-banner
